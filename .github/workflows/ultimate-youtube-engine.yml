name: ultimate-youtube-engine

# Lets the Pages UI show the live run status for its own job.
run-name: generate_video ${{ github.event.client_payload.job_id }}

on:
  repository_dispatch:
    types: [generate_video]

permissions:
  contents: read

jobs:
  render:
    name: Render video
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg wget jq libgbm1 \
            libnss3 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libpango-1.0-0 libcairo2 \
            fonts-liberation fonts-dejavu-core

          # Chromium runtime libraries. Ubuntu 24.04 renamed a few of them for
          # the 64-bit time_t transition, so try both spellings.
          first_available() {
            for name in "$@"; do
              if sudo apt-get install -y --no-install-recommends "$name" >/dev/null 2>&1; then
                echo "installed $name"
                return 0
              fi
            done
            echo "::warning::could not install any of: $*"
            return 0
          }
          first_available libatk1.0-0t64 libatk1.0-0
          first_available libatk-bridge2.0-0t64 libatk-bridge2.0-0
          first_available libcups2t64 libcups2
          first_available libatspi2.0-0t64 libatspi2.0-0
          first_available libasound2t64 libasound2

      - name: Allow unprivileged user namespaces (AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Read the dispatch payload
        id: payload
        run: |
          set -euo pipefail
          job_id="$(jq -r '.client_payload.job_id // ""' "$GITHUB_EVENT_PATH")"
          if [[ ! "$job_id" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "::error::Invalid job_id (must be alphanumeric), refusing to continue."
            exit 1
          fi
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "JOB_ID=$job_id" >> "$GITHUB_ENV"

      - name: Write the narration and code assets
        run: |
          set -euo pipefail
          mkdir -p src/assets out
          jq -r '.client_payload.script // ""' "$GITHUB_EVENT_PATH" > narration.txt
          jq -r '.client_payload.code // ""' "$GITHUB_EVENT_PATH" > src/assets/code.txt

          if ! grep -q '[^[:space:]]' narration.txt; then
            echo "::warning::empty script supplied, using a placeholder line"
            printf 'Here is the code.\n' > narration.txt
          fi

          wc -c narration.txt src/assets/code.txt

      - name: Install Piper and the en_US-ryan-high voice
        run: |
          set -euo pipefail
          wget -q -O piper.tar.gz \
            https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper.tar.gz

          wget -q -O en_US-ryan-high.onnx \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high/en_US-ryan-high.onnx
          wget -q -O en_US-ryan-high.onnx.json \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/ryan/high/en_US-ryan-high.onnx.json

          test -x piper/piper
          ls -la en_US-ryan-high.onnx en_US-ryan-high.onnx.json

      - name: Synthesize the voiceover
        run: |
          set -euo pipefail
          cd piper
          LD_LIBRARY_PATH=. ./piper \
            --model ../en_US-ryan-high.onnx \
            --espeak_data ./espeak-ng-data \
            --output_file ../voiceover.wav \
            < ../narration.txt
          cd ..
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 voiceover.wav

      - name: Write the duration metadata
        run: |
          set -euo pipefail
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 voiceover.wav)"
          printf '{"duration": %s}\n' "$duration" > src/assets/meta.json
          cat src/assets/meta.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Make sure Chromium is available for Revideo
        run: npx --yes puppeteer browsers install chrome

      - name: Render the silent video
        run: node render.mjs

      - name: Mux the voiceover onto the video
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -y \
            -i out/silent.mp4 \
            -i voiceover.wav \
            -filter_complex '[1:a]apad[a]' \
            -map 0:v:0 -map '[a]' \
            -r 60 -pix_fmt yuv420p \
            -c:v libx264 -preset veryfast -crf 20 \
            -c:a aac -b:a 192k \
            -shortest \
            final.mp4
          ls -la final.mp4
          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of default=nw=1 final.mp4

      - name: Upload the video
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.payload.outputs.job_id }}
          path: final.mp4
          if-no-files-found: error
          retention-days: 30
